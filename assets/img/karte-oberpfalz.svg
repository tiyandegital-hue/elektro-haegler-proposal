<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" role="img" aria-labelledby="map-title map-desc">
  <title id="map-title">Einsatzgebiet Pfreimd und Oberpfalz — schematische Karte</title>
  <desc id="map-desc">Schematische, nicht massstabsgetreue Darstellung des Einsatzgebiets mit Pfreimd und Schwandorf.</desc>
  <rect width="600" height="380" fill="#141613"/>
  <g stroke="#2C2E2B" stroke-width="1">
    <path d="M0 60h600M0 120h600M0 180h600M0 240h600M0 300h600M100 0v380M200 0v380M300 0v380M400 0v380M500 0v380"/>
  </g>
  <!-- abstract region outline -->
  <path d="M90 300 L70 200 L120 110 L210 60 L330 55 L430 90 L520 80 L540 160 L500 250 L470 320 L330 345 L200 330 Z"
        fill="#1B1D1A" stroke="#FED136" stroke-width="2"/>
  <text x="300" y="40" font-family="monospace" font-size="12" letter-spacing="4" fill="#8A8F8A" text-anchor="middle">OBERPFALZ // BAYERN</text>
  <!-- road lines -->
  <g stroke="#434541" stroke-width="2" fill="none" stroke-dasharray="8 6">
    <path d="M120 300 L260 190 L420 130"/>
    <path d="M260 190 L300 320"/>
    <path d="M260 190 L180 80"/>
  </g>
  <!-- Pfreimd marker -->
  <g>
    <circle cx="260" cy="190" r="18" fill="none" stroke="#FED136" stroke-width="1.5"/>
    <circle cx="260" cy="190" r="9" fill="#FED136"/>
    <text x="260" y="160" font-family="monospace" font-size="15" letter-spacing="2" fill="#FED136" text-anchor="middle" font-weight="bold">PFREIMD</text>
    <text x="260" y="222" font-family="monospace" font-size="10" letter-spacing="2" fill="#F4F2EC" text-anchor="middle">SITZ // SCHMELZWEG 1</text>
  </g>
  <!-- Schwandorf marker -->
  <g>
    <rect x="412" y="122" width="16" height="16" fill="#F4F2EC"/>
    <text x="420" y="112" font-family="monospace" font-size="13" letter-spacing="2" fill="#F4F2EC" text-anchor="middle">SCHWANDORF</text>
  </g>
  <!-- compass -->
  <g transform="translate(540,330)">
    <circle r="22" fill="none" stroke="#8A8F8A"/>
    <path d="M0 -16 L5 6 L0 2 L-5 6 Z" fill="#FED136"/>
    <text y="-28" font-family="monospace" font-size="11" fill="#8A8F8A" text-anchor="middle">N</text>
  </g>
  <text x="24" y="360" font-family="monospace" font-size="10" letter-spacing="2" fill="#8A8F8A">SCHEMATISCHE DARSTELLUNG — NICHT MASSSTABSGETREU</text>
</svg>
